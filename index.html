<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#2a2130;--fg:#efe6f2;--muted:#bfaecb;--card:#3a2d42;--line:#54435f;--display:"Gloock",Georgia,serif;--body:"Figtree",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding:0 16px;min-height:100vh;display:grid;place-items:center}
main{max-width:720px;width:100%;padding-block:40px;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0}
p{margin:0;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none}
a:hover{border-color:var(--fg)}a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a img{width:64px;height:64px;border-radius:14px}a b{font-family:var(--display);font-weight:400;font-size:24px;display:block}a span{color:var(--muted);font-size:14px}
</style></head><body><main>
